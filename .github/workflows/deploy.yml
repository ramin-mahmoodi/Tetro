name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: npm test

      - name: Run syntax and lint checks
        run: npm run lint

      - name: Fetch and compile market data
        run: node scripts/fetch-market-data.js
        env:
          IRAN_PROXY: ${{ secrets.IRAN_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}

      - name: Commit updated market data
        if: github.event_name == 'schedule'
        run: |
          git config --global user.name "Ramin Mahmoodi"
          git config --global user.email "ramin-mahmoodi@users.noreply.github.com"
          git add data/market.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync market data [skip ci]" && git push)

      - name: Build production bundle
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
